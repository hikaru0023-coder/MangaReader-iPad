name: Build MangaReader Android APK

on:
  push:
    branches:
      - android-apk-v1.1.2
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Android source project
        run: |
          mkdir -p "$RUNNER_TEMP/mangareader-source"
          cat android/source-b64/part-*.txt | base64 --decode > "$RUNNER_TEMP/MangaReader-v1.1.2.tar.xz"
          tar -xJf "$RUNNER_TEMP/MangaReader-v1.1.2.tar.xz" -C "$RUNNER_TEMP/mangareader-source"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/mangareader-source/MangaReader
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp "$RUNNER_TEMP/mangareader-source/MangaReader/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/MangaReader-v1.1.2-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-v1.1.2-APK
          path: ${{ runner.temp }}/MangaReader-v1.1.2-debug.apk
          if-no-files-found: error
          retention-days: 30
