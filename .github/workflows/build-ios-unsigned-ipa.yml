name: Build MangaReader iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on cloud macOS
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Xcode project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mangareader-source"
          cat source-bundle/part-*.txt | base64 --decode | tar -xz -C "$RUNNER_TEMP/mangareader-source"
          test -d "$RUNNER_TEMP/mangareader-source/MangaReader-iPad/MangaReader-iPad.xcodeproj"
          echo "PROJECT_DIR=$RUNNER_TEMP/mangareader-source/MangaReader-iPad" >> "$GITHUB_ENV"

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_DIR/MangaReader-iPad.xcodeproj" \
            -scheme MangaReader-iPad

      - name: Build for iOS Simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_DIR/MangaReader-iPad.xcodeproj" \
            -scheme MangaReader-iPad \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for iPadOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_DIR/MangaReader-iPad.xcodeproj" \
            -scheme MangaReader-iPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MangaReader-iPad.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MangaReader-iPad.xcarchive/Products/Applications/MangaReader-iPad.app"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build-output"
          test -d "$APP_PATH"
          rm -rf "$PACKAGE_DIR" "$OUTPUT_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$OUTPUT_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/MangaReader-iPad.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa" Payload
          test -s "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa"
          shasum -a 256 "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa" > "$OUTPUT_DIR/SHA256.txt"
          cat > "$OUTPUT_DIR/INSTALL-NOTE.txt" <<'NOTE'
          This is an unsigned IPA. It is not directly installable until signed.
          Use a trusted Windows sideloading workflow and your own Apple Account.
          Never share your Apple Account password or signing certificates in this repository.
          NOTE

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-iPad-unsigned-IPA
          path: build-output/
          if-no-files-found: error
          retention-days: 14
