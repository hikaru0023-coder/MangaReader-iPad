name: Build MangaReader iPad IPA (macOS 26 Intel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source-bundle/**'
      - '.github/workflows/build-ios-unsigned-ipa-intel.yml'
      - 'scripts/fix-reader-zoom.py'
      - 'scripts/add-wifi-transfer.py'
      - 'scripts/add-horizontal-page-scrub.py'
      - 'scripts/add-night-reading-mode.py'
      - 'scripts/add-wifi-folder-management.py.xz.b64'
      - 'scripts/remove-auto-page-and-sort-comics.py.xz.b64'
      - 'scripts/recover-imported-comics.py'
      - 'overlay/wifi-lzma-*.txt'

concurrency:
  group: mangareader-ipad-ipa-macos26-intel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPad IPA on macOS 26 Intel
    runs-on: macos-26-intel
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm macOS 26 Intel runner and Xcode
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks

      - name: Restore Xcode project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mangareader-source"
          cat source-bundle/part-*.txt | base64 --decode | tar -xz -C "$RUNNER_TEMP/mangareader-source"
          PROJECT_DIR="$RUNNER_TEMP/mangareader-source/MangaReader-iPad"
          test -d "$PROJECT_DIR/MangaReader-iPad.xcodeproj"
          test -f "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix pinch zoom-out and two-finger pan handling
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/fix-reader-zoom.py" "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"

      - name: Restore and install Wi-Fi transfer feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wifi-overlay"
          python3 - <<'PY'
          import base64
          import io
          import lzma
          import os
          import tarfile
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          chunks = [
              root / "overlay/wifi-lzma-00.txt",
              root / "overlay/wifi-lzma-01.txt",
              root / "overlay/wifi-lzma-02.txt",
              root / "overlay/wifi-lzma-03.txt",
          ]
          encoded = "".join(p.read_text().strip() for p in chunks)
          archive = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = {"WiFiTransferServer.swift", "add-wifi-transfer.py"}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              members = {Path(m.name).name: m for m in tar.getmembers() if m.isfile()}
              if set(members) != expected:
                  raise SystemExit(f"Unexpected Wi-Fi overlay files: {sorted(members)}")
              output = Path(os.environ["RUNNER_TEMP"]) / "wifi-overlay"
              for name in sorted(expected):
                  stream = tar.extractfile(members[name])
                  if stream is None:
                      raise SystemExit(f"Missing archived payload: {name}")
                  (output / name).write_bytes(stream.read())
          print("Restored PIN-protected Wi-Fi transfer overlay.")
          PY
          python3 "$GITHUB_WORKSPACE/scripts/add-wifi-transfer.py" \
            "$PROJECT_DIR" "$RUNNER_TEMP/wifi-overlay/WiFiTransferServer.swift"

      - name: Add horizontal page scrubbing and bottom progress bar
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/add-horizontal-page-scrub.py" "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"

      - name: Enable automatic low-blue-light night reading mode
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/add-night-reading-mode.py" "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"

      - name: Add Wi-Fi folder management, categorized uploads and library filters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          encoded = (root / "scripts/add-wifi-folder-management.py.xz.b64").read_text().strip()
          script = lzma.decompress(base64.b64decode(encoded, validate=True))
          output = Path(os.environ["RUNNER_TEMP"]) / "add-wifi-folder-management.py"
          output.write_bytes(script)
          print(f"Restored folder management patch: {len(script)} bytes")
          PY
          python3 "$RUNNER_TEMP/add-wifi-folder-management.py" \
            "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift" \
            "$PROJECT_DIR/MangaReader-iPad/WiFiTransferServer.swift"

      - name: Remove the auto-page floating control and sort comics by name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          encoded = (root / "scripts/remove-auto-page-and-sort-comics.py.xz.b64").read_text().strip()
          script = lzma.decompress(base64.b64decode(encoded, validate=True))
          output = Path(os.environ["RUNNER_TEMP"]) / "remove-auto-page-and-sort-comics.py"
          output.write_bytes(script)
          print(f"Restored no-auto-page/natural-sort patch: {len(script)} bytes")
          PY
          python3 "$RUNNER_TEMP/remove-auto-page-and-sort-comics.py" \
            "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"

      - name: Recover comic files and repair saved library paths
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/recover-imported-comics.py" "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift"

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_DIR/MangaReader-iPad.xcodeproj" \
            -scheme MangaReader-iPad

      - name: Archive for iPadOS
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_DIR/MangaReader-iPad.xcodeproj" \
            -scheme MangaReader-iPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MangaReader-iPad.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MangaReader-iPad.xcarchive/Products/Applications/MangaReader-iPad.app"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build-output"
          test -d "$APP_PATH" || {
            echo "App bundle missing at: $APP_PATH"
            find "$RUNNER_TEMP/MangaReader-iPad.xcarchive/Products" -maxdepth 4 -print || true
            exit 1
          }
          rm -rf "$PACKAGE_DIR" "$OUTPUT_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$OUTPUT_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/MangaReader-iPad.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa" Payload
          test -s "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa"
          shasum -a 256 "$OUTPUT_DIR/MangaReader-iPad-unsigned.ipa" > "$OUTPUT_DIR/SHA256.txt"
          cp "$PROJECT_DIR/MangaReader-iPad/MangaReaderApp.swift" "$OUTPUT_DIR/MangaReaderApp.swift"
          cp "$PROJECT_DIR/MangaReader-iPad/WiFiTransferServer.swift" "$OUTPUT_DIR/WiFiTransferServer.swift"
          cat > "$OUTPUT_DIR/INSTALL-NOTE.txt" <<'NOTE'
          This is an unsigned IPA. It still needs to be signed for installation.
          Use a trusted Windows sideloading tool with your own Apple Account.
          Never upload Apple Account passwords, certificates, or provisioning profiles to this public repository.
          NOTE

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-iPad-unsigned-IPA-Intel
          path: build-output/
          if-no-files-found: error
          retention-days: 14
