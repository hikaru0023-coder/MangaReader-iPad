name: Build MediaPlayer iPad unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MediaPlayer_iPad/source-bundle/**"
      - "MediaPlayer_iPad/README.md"
      - ".github/workflows/build-mediaplayer-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPad IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack MediaPlayer source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaplayer-source"
          base64 -D -i "MediaPlayer_iPad/source-bundle/MediaPlayer_Source.tar.gz.b64" \
            -o "$RUNNER_TEMP/MediaPlayer_Source.tar.gz"
          tar -xz -f "$RUNNER_TEMP/MediaPlayer_Source.tar.gz" -C "$RUNNER_TEMP/mediaplayer-source"
          echo "PROJECT_DIR=$RUNNER_TEMP/mediaplayer-source/MediaPlayer_iPad" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/mediaplayer-source/MediaPlayer_iPad/MediaPlayer.xcodeproj/project.pbxproj"

      - name: Apply VLC API compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("$RUNNER_TEMP/mediaplayer-source/MediaPlayer_iPad/MediaPlayer/PlayerScreen.swift")
          source = p.read_text()
          source = source.replace("player.time?.intValue", "player.time.intValue")
          source = source.replace("player.position = Float(clamped)", "player.position = clamped")
          p.write_text(source)
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_DIR/MediaPlayer.xcodeproj" \
            -scheme MediaPlayer

      - name: Archive for generic iOS device (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_DIR/MediaPlayer.xcodeproj" \
            -scheme MediaPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MediaPlayer.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/MediaPlayer-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MediaPlayer.xcarchive/Products/Applications/MediaPlayer.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "MediaPlayer.app not found in archive." >&2
            find "$RUNNER_TEMP/MediaPlayer.xcarchive/Products" -maxdepth 4 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa-root/Payload" "$GITHUB_WORKSPACE/build-output"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa-root/Payload/MediaPlayer.app"
          (cd "$RUNNER_TEMP/ipa-root" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/build-output/MediaPlayer-unsigned.ipa")

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" \
            > "$GITHUB_WORKSPACE/build-output/BundleIdentifier.txt"
          shasum -a 256 "$GITHUB_WORKSPACE/build-output/MediaPlayer-unsigned.ipa" \
            > "$GITHUB_WORKSPACE/build-output/SHA256SUMS.txt"
          cat > "$GITHUB_WORKSPACE/build-output/INSTALL-NOTES.txt" <<'NOTES'
          This is an unsigned iOS app package. It cannot be installed directly.
          On Windows, import MediaPlayer-unsigned.ipa into Sideloadly and sign it
          with your own Apple Account before installing it on your iPad.
          A valid Apple signing identity and a suitable provisioning profile are
          required for distribution outside a development sideload workflow.
          NOTES

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-iPad-unsigned-IPA
          path: build-output/
          if-no-files-found: error
          retention-days: 14
